name: Daily EOD Price & P/E Sync

on:
  schedule:
    # Runs Monday to Friday at 6:30 PM IST (13:00 UTC)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-prices:
    name: Sync Daily EOD Prices & Dynamic Multiples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute daily price sync
        run: |
          python sync_daily_prices.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes detected in data.json. Nothing to commit."
          else
            git commit -m "Auto-sync: Daily EOD Price & P/E Update [skip ci]"
            git push origin main
          fi
